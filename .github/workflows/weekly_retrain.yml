name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch latest 3 years of history
        working-directory: src
        run: |
          END=$(date -u -d "yesterday" +%Y-%m-%d)
          START=$(date -u -d "3 years ago" +%Y-%m-%d)
          python fetch_data.py --start "$START" --end "$END" --out ../data/history.csv

      - name: Retrain models
        working-directory: src
        run: python train_model.py --data ../data/history.csv --out-dir ../models

      - name: Commit updated data and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.csv models/*.joblib
          git diff --staged --quiet || git commit -m "Weekly retrain: $(date -u +'%Y-%m-%d')"
          git push
